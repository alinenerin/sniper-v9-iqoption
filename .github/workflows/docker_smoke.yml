name: Docker Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'Dockerfile'
      - 'requirements-gateway.txt'
      - 'current_iq.py'
      - 'live_stream_cache.py'
      - 'scripts/fetch_railway_market.py'
      - 'scripts/fast_market_lane.py'
      - 'scripts/refresh_final_timing.py'
      - 'scripts/warm_readonly_gateway.py'
      - 'tests/test_live_stream*.py'
      - 'tests/test_warm_readiness.py'
      - 'market_gateway.py'
      - 'market_data_contract.py'
      - 'railway_start.py'
      - 'network_diagnostics.py'
      - 'iqoptionapi/**'
      - '.github/workflows/docker_smoke.yml'

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for read-only gateway contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test live-stream readiness and read-only routes
        run: |
          python -m pip install --disable-pip-version-check -r requirements-gateway.txt
          python -m unittest -v tests.test_live_stream_cache tests.test_live_stream_integration tests.test_warm_readiness tests.test_iq_sdk_singleflight

      - name: Build image without cache
        run: docker build --pull --no-cache -t sniper-gateway-smoke:${{ github.sha }} .

      - name: Verify imports and read-only flags
        run: |
          docker run --rm \
            -e ANALYSIS_ONLY=1 \
            -e READ_ONLY=true \
            -e EXECUTION_ALLOWED=false \
            -e EXECUTOR_ENABLED=false \
            sniper-gateway-smoke:${{ github.sha }} \
            python -c "import current_iq, market_gateway; print('imports_ok'); print('read_only_contract_ok')"

      - name: Start temporary gateway
        run: |
          docker run -d --name sniper-gateway-smoke \
            -p 8080:8080 \
            -e ANALYSIS_ONLY=1 \
            -e READ_ONLY=true \
            -e EXECUTION_ALLOWED=false \
            -e EXECUTOR_ENABLED=false \
            sniper-gateway-smoke:${{ github.sha }}

      - name: Healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              echo 'healthcheck_ok'
              exit 0
            fi
            sleep 2
          done
          docker logs sniper-gateway-smoke || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f sniper-gateway-smoke || true
