name: Unified V16 Scan - Read Only

on:
  workflow_dispatch:
    inputs:
      include_otc:
        description: 'Incluir pares OTC'
        required: true
        default: false
        type: boolean
      symbols:
        description: 'Pares separados por espaço ou vírgula'
        required: true
        default: 'ALL_AVAILABLE'
        type: string
      otc_only:
        description: 'Analisar somente OTC, sem Forex real ou binárias reais'
        required: true
        default: false
        type: boolean
      fast_mode:
        description: 'Usar lane rápido read-only para sinais atuais'
        required: true
        default: false
        type: boolean
      market:
        description: 'Mercado do pipeline: binary, forex ou unified'
        required: true
        default: 'binary'
        type: choice
        options:
          - binary
          - forex
          - unified

jobs:
  unified-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANALYSIS_ONLY: '1'
      EXECUTION_ALLOWED: 'false'
      EXECUTOR_ENABLED: 'false'
      INCLUDE_OTC: ${{ inputs.include_otc }}
      OTC_ONLY: ${{ inputs.otc_only }}
      SYMBOLS: ${{ inputs.symbols }}
      MARKET: ${{ inputs.market }}
      FAST_MODE: ${{ inputs.fast_mode }}
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore persistent Python intelligence environment
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: v16-python311-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-intelligence-v3
      - name: Prepare Python intelligence environment
        if: steps.python-env-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install 'Darts>=0.30,<1.0' 'timesfm>=1.3.0'
          .venv/bin/pip install 'torch>=2.2' 'transformers>=4.40' sentencepiece requests
          .venv/bin/pip install 'xgboost>=2.0' scikit-learn
      - name: Activate cached Python environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Architecture guard
        run: |
          python audit_architecture.py
          python audit_readonly_validation.py
      - name: Fetch live market data from Railway
        env:
          RAILWAY_GATEWAY_URL: https://trader-analysis-api-production-82ba.up.railway.app
        run: python scripts/fetch_railway_market.py
      - name: Fetch canonical DXY/VIX macro snapshot
        if: inputs.fast_mode != true
        run: python scripts/fetch_tradingview_macro.py
      - name: Prepare fast lane advisory artifacts
        if: inputs.fast_mode == true
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          base={'status':'blocked','read_only':True,'execution_allowed':False,'components':{}}
          for name in ('darts_inference','timesfm_inference','xgboost_inference'):
              json.dump(base,open('reports/'+name+'.json','w'))
          finbert=dict(base, provider='Finnhub', fetch_diagnostics={'valid_json':True})
          json.dump(finbert,open('reports/finbert_inference.json','w'))
          json.dump({'ok':False,'reason':'FAST_MODE_MACRO_ADVISORY_SKIPPED','symbols':{}},open('reports/macro_data.json','w'))
          PY
      - name: Cache FinBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-${{ runner.os }}-v1
      - name: Run intelligence modules in parallel (read-only)
        if: inputs.fast_mode != true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_CACHE: ~/.cache/huggingface
        shell: bash
        run: |
          set +e
          mkdir -p reports/module-logs
          python scripts/run_darts_inference.py > reports/module-logs/darts.log 2>&1 & p1=$!
          python scripts/run_timesfm_inference.py > reports/module-logs/timesfm.log 2>&1 & p2=$!
          python scripts/run_finbert_inference.py > reports/module-logs/finbert.log 2>&1 & p3=$!
          python scripts/train_xgboost_inference.py > reports/module-logs/xgboost.log 2>&1 & p4=$!
          wait $p1; r1=$?; wait $p2; r2=$?; wait $p3; r3=$?; wait $p4; r4=$?
          echo "module_exit_codes darts=$r1 timesfm=$r2 finbert=$r3 xgboost=$r4"
          echo "--- xgboost.log ---"; cat reports/module-logs/xgboost.log || true
          echo "--- timesfm.log ---"; tail -80 reports/module-logs/timesfm.log || true
          # Modules are advisory/read-only; their evidence is inspected by the report.
          exit 0
      - name: Compile read-only analysis modules
        run: python -m py_compile shared_ai/consultation.py scripts/generate_scan_report.py scripts/evaluate_hypothetical_expiration.py scripts/run_darts_inference.py scripts/run_timesfm_inference.py scripts/run_finbert_inference.py scripts/train_xgboost_inference.py
      - name: Generate unified report from Railway candles
        run: python scripts/generate_scan_report.py
      - name: Run TradingAgents shadow committee
        run: python scripts/run_tradingagents_shadow.py
      - name: Evaluate hypothetical result after expiration
        env:
          # Do not spend the workflow timeout waiting for a future candle;
          # the evaluator remains read-only and records pending_expiration when
          # no post-decision candle exists yet.
          PAPER_EXPIRATION_WAIT_SECONDS: 0
        run: python scripts/evaluate_hypothetical_expiration.py
      - name: Validate report contract and component evidence
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('reports/latest_scan.json'))
          macro=r.get('macro_data') or {}
          # External macro/news outages are data-quality vetoes, not workflow crashes.
          # The report remains valid read-only, but no signal may be treated as
          # operationally approved while macro/news evidence is unavailable.
          if not r.get('inputs', {}).get('otc_only') and macro.get('ok') is not True:
              print('macro_evidence=BLOCKED:', macro.get('reason'))
          finbert=json.load(open('reports/finbert_inference.json'))
          assert finbert.get('read_only') is True
          assert finbert.get('execution_allowed') is False
          assert finbert.get('status') in ('ok', 'blocked', 'error'), finbert.get('status')
          if finbert.get('status') != 'ok':
              print('news_evidence=BLOCKED:', finbert.get('fetch_error') or finbert.get('reason'))
          assert finbert.get('fetch_diagnostics', {}).get('valid_json') is True
          assert r['execution_allowed'] is False
          assert r['mode'] == 'read_only'
          assert 'binary' in r and 'forex' in r
          assert r['binary']['status'] == ('completed' if os.environ.get('MARKET') in ('binary', 'unified') else 'not_requested')
          assert r['forex']['status'] == ('completed' if os.environ.get('MARKET') in ('forex', 'unified') else 'not_requested')
          if os.environ.get('MARKET') == 'binary': assert not r['forex'].get('analyses')
          if os.environ.get('MARKET') == 'forex': assert not r['binary'].get('analyses')
          if r.get('inputs', {}).get('otc_only'):
              assert r.get('inputs', {}).get('include_otc') is True
              assert not r['forex'].get('analyses')
          for book_name, book in (('forex', r['forex']), ('binary', r['binary'])):
              for item in book.get('analyses', []):
                  assert item.get('execution_allowed') is False, (book_name, item.get('symbol'))
                  components=item.get('components') or {}
                  assert isinstance(components, dict), (book_name, item.get('symbol'))
                  assert 'direction_calculated' in item
                  assert 'candle_timing' in item and 'last_candle_timestamp_utc' in item['candle_timing']
                  assert 'expiration' in item and 'hypothetical_result' in item['expiration']
                  for name, component in components.items():
                      assert isinstance(component, dict), (name, component)
                      status=component.get('status')
                      assert status in ('inference_ok', 'blocked', 'error', 'insufficient-data'), (name, status)
                      if status in ('blocked', 'error', 'insufficient-data'): assert component.get('reason'), (name, component)
          otc = [x for x in r['binary']['analyses'] if x.get('market') == 'otc']
          md_symbols = (r.get('market_data') or {}).get('symbols') or {}
          expected_otc = len([s for s in md_symbols if str(s).upper().endswith('-OTC')]) if r.get('inputs', {}).get('include_otc') else 0
          assert len(otc) == expected_otc, (len(otc), expected_otc)
          for item in otc:
              # A valid OTC inference must identify the authoritative chart.
              # A blocked item may instead be rejected for missing/invalid candles;
              # that is a data-quality veto, not a contract failure.
              if item.get('status') == 'inference_ok':
                  assert item.get('decision_basis') == 'OTC_IQ_CHART_AUTHORITATIVE'
                  assert item.get('chart_evidence', {}).get('ema_cascade') == 'engine'
              else:
                  assert item.get('decision_basis') in ('OTC_IQ_CHART_AUTHORITATIVE', 'MISSING_INVALID_CANDLES')
              assert item.get('execution_allowed') is False
              assert set(('darts', 'finbert')).issubset(item.get('components', {}))
          print('unified_report=OK; component_statuses=OK; execution=BLOCKED')
          PY
      - name: Upload latest scan
        uses: actions/upload-artifact@v4
        with:
          name: latest-scan-${{ github.run_id }}
          path: |
            reports/latest_scan.json
            reports/tradingagents_shadow.json
            reports/darts_inference.json
            reports/finbert_inference.json
