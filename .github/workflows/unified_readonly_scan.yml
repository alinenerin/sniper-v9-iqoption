name: Unified V16 Scan - Read Only

# The gateway uses one serialized IQ Option session. Overlapping scans queue
# provider calls and make live candles stale, so only the newest scan may run.
concurrency:
  group: bqx-single-iqoption-session
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      include_otc:
        description: 'Incluir pares OTC'
        required: true
        default: false
        type: boolean
      symbols:
        description: 'Pares separados por espaço ou vírgula'
        required: true
        default: 'ALL_AVAILABLE'
        type: string
      otc_only:
        description: 'Analisar somente OTC, sem Forex real ou binárias reais'
        required: true
        default: false
        type: boolean
      fast_mode:
        description: 'Usar rota rápida M1/M5 para todos os pares solicitados'
        required: true
        default: false
        type: boolean
      sniper_mode:
        description: 'Modo isolado: análise binária real de até 3 pares, com registro antecipado somente após aprovação canônica'
        required: true
        default: false
        type: boolean
      no_score_mode:
        description: 'Ativar modo comparativo sem score (opcional)'
        required: true
        default: false
        type: boolean
      market:
        description: 'Mercado do pipeline: binary, forex ou unified'
        required: true
        default: 'binary'
        type: choice
        options:
          - binary
          - forex
          - unified

jobs:
  unified-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANALYSIS_ONLY: '1'
      EXECUTION_ALLOWED: 'false'
      EXECUTOR_ENABLED: 'false'
      INCLUDE_OTC: ${{ github.event.inputs.include_otc }}
      OTC_ONLY: ${{ github.event.inputs.otc_only }}
      SYMBOLS: ${{ github.event.inputs.symbols }}
      MARKET: ${{ github.event.inputs.market }}
      FAST_MODE: ${{ github.event.inputs.fast_mode }}
      SNIPER_MODE: ${{ github.event.inputs.sniper_mode }}
      NO_SCORE_MODE: ${{ github.event.inputs.no_score_mode }}
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow start epoch
        run: echo "SCAN_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate and prepare isolated sniper inputs before gateway calls
        if: github.event.inputs.sniper_mode == 'true'
        run: python scripts/sniper_mode.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore persistent Python intelligence environment
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: v16-python311-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-intelligence-v5
      - name: Prepare Python intelligence environment
        if: steps.python-env-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install 'Darts>=0.30,<1.0' 'timesfm>=1.3.0' 'torch>=2.2' 'transformers>=4.40' sentencepiece requests 'xgboost>=2.0' scikit-learn
      - name: Activate cached Python environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify and repair cached dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'Darts>=0.30,<1.0' 'timesfm>=1.3.0' 'torch>=2.2' 'transformers>=4.40' sentencepiece requests 'xgboost>=2.0' scikit-learn
          python - <<'PYDEPS'
          import importlib.metadata as metadata
          import numpy, pytz, pandas, requests, darts, timesfm, torch
          for module, package in ((darts, 'darts'), (timesfm, 'timesfm'), (torch, 'torch')):
              print(f'{package}_import=OK version={metadata.version(package)}')
          print('core_dependencies=OK', numpy.__version__, pytz.__version__)
          PYDEPS
      - name: Architecture guard
        run: |
          python audit_architecture.py
          python audit_readonly_validation.py
      - name: Run offline read-only contract tests
        env:
          # Unit tests must exercise the ordinary path even during a sniper dispatch.
          SNIPER_MODE: 'false'
        run: python -m unittest discover -s tests -t . -v
      - name: Warm active read-only Render/IQ Option gateway
        env:
          MARKET_GATEWAY_URL: https://iqoption-readonly-gateway.onrender.com
        run: |
          health_started=$(date +%s.%N)
          for i in 1 2 3; do
            if curl --silent --show-error --connect-timeout 8 --max-time 20 --fail "$MARKET_GATEWAY_URL/health" | python -c 'import json,sys; d=json.load(sys.stdin); c=d.get("connection") or {}; ok=d.get("status")=="connected" and c.get("status")=="connected"; print("gateway_status=%s connection_status=%s" % (d.get("status"), c.get("status"))); sys.exit(0 if ok else 1)'; then
              echo 'Read-only gateway is connected.'
              python scripts/record_sniper_timing.py gateway_health "$health_started"
              exit 0
            fi
            echo "Gateway is not connected yet (attempt $i/3)."
            if [ "$i" -lt 3 ]; then sleep 3; fi
          done
          echo 'Gateway did not reach connected state; stopping before market-data fetch.' >&2
          exit 1
      - name: Fetch live market data from active read-only gateway
        env:
          MARKET_GATEWAY_URL: https://iqoption-readonly-gateway.onrender.com
          FAST_TRIAGE: ${{ github.event.inputs.fast_mode }}
          REQUEST_M1_CANDLES: '1000'
          REQUEST_M5_CANDLES: ${{ github.event.inputs.fast_mode == 'true' && '31' || '100' }}
          MAX_CANDLE_AGE_SECONDS: ${{ github.event.inputs.fast_mode == 'true' && '90' || '120' }}
          FETCH_TIMEOUT_SECONDS: ${{ github.event.inputs.fast_mode == 'true' && '8' || '25' }}
          FETCH_RETRIES: ${{ github.event.inputs.fast_mode == 'true' && '0' || '3' }}
        # The fetcher exits 0 with any valid pair; zero usable pairs remain fatal.
        run: |
          fetch_started=$(date +%s.%N)
          python scripts/fetch_railway_market.py
          rc=$?
          python scripts/record_sniper_timing.py market_data_fetch "$fetch_started"
          exit "$rc"
      - name: Fetch canonical DXY/VIX macro snapshot
        run: |
          macro_started=$(date +%s.%N)
          python scripts/fetch_tradingview_macro.py
          rc=$?
          python scripts/record_sniper_timing.py macro_snapshot "$macro_started"
          exit "$rc"
      - name: Prepare fast lane advisory artifacts (disabled)
        if: false
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          base={'status':'blocked','read_only':True,'execution_allowed':False,'components':{}}
          for name in ('darts_inference','timesfm_inference','xgboost_inference'):
              json.dump(base,open('reports/'+name+'.json','w'))
          finbert=dict(base, provider='Finnhub', fetch_diagnostics={'valid_json':True})
          json.dump(finbert,open('reports/finbert_inference.json','w'))
          json.dump({'ok':False,'reason':'FAST_MODE_MACRO_ADVISORY_SKIPPED','symbols':{}},open('reports/macro_data.json','w'))
          PY
      - name: Cache FinBERT and TimesFM model artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-timesfm-prosusai-${{ runner.os }}-v2
      - name: Run intelligence modules in parallel (read-only)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          HF_HOME: ~/.cache/huggingface
          TRANSFORMERS_CACHE: ~/.cache/huggingface
        shell: bash
        run: |
          modules_started=$(date +%s.%N)
          set +e
          mkdir -p reports/module-logs
          python scripts/run_darts_inference.py > reports/module-logs/darts.log 2>&1 & p1=$!
          python scripts/run_timesfm_inference.py > reports/module-logs/timesfm.log 2>&1 & p2=$!
          python scripts/run_finbert_inference.py > reports/module-logs/finbert.log 2>&1 & p3=$!
          python scripts/train_xgboost_inference.py > reports/module-logs/xgboost.log 2>&1 & p4=$!
          python scripts/run_m5_inference.py > reports/module-logs/m5_shadow.log 2>&1 & p5=$!
          wait $p1; r1=$?; wait $p2; r2=$?; wait $p3; r3=$?; wait $p4; r4=$?; wait $p5; r5=$?
          python scripts/record_sniper_timing.py mandatory_and_advisory_modules "$modules_started"
          echo "module_exit_codes darts=$r1 timesfm=$r2 finbert=$r3 xgboost=$r4 m5_shadow=$r5"
          echo "--- xgboost.log ---"; cat reports/module-logs/xgboost.log || true
          echo "--- timesfm.log ---"; tail -80 reports/module-logs/timesfm.log || true
          echo "--- m5_shadow.log ---"; cat reports/module-logs/m5_shadow.log || true
          # Modules are advisory/read-only; their evidence is inspected by the report.
          exit 0
      - name: Compile read-only analysis modules
        run: python -m py_compile shared_ai/consultation.py scripts/generate_scan_report.py scripts/sniper_mode.py scripts/record_sniper_timing.py engines/binary/sniper_timing.py scripts/evaluate_hypothetical_expiration.py scripts/run_darts_inference.py scripts/run_timesfm_inference.py scripts/run_finbert_inference.py scripts/train_xgboost_inference.py scripts/run_m5_inference.py scripts/run_sniper_layer_b.py
      - name: Refresh final M1/M5 timing without replacing agent evidence
        if: github.event.inputs.sniper_mode == 'true' || github.event.inputs.fast_mode != 'true'
        env:
          MARKET_GATEWAY_URL: https://iqoption-readonly-gateway.onrender.com
          FAST_TRIAGE: 'true'
          REQUEST_M1_CANDLES: '1000'
          MAX_CANDLE_AGE_SECONDS: '90'
        run: |
          timing_started=$(date +%s.%N)
          cp reports/market_data.json reports/agent_market_data.json
          python scripts/refresh_final_timing.py
          rc=$?
          mv reports/agent_market_data.json reports/market_data.json
          python scripts/record_sniper_timing.py final_timing_refresh "$timing_started"
          exit "$rc"
      - name: Verify current analysis commit and official thresholds
        run: |
          python - <<'PYCONFIG'
          import os
          from config.settings import TRADING_CONFIG
          print("analysis_commit=" + os.environ.get("GITHUB_SHA", "unknown"))
          print("thresholds=", TRADING_CONFIG.diamond_threshold, TRADING_CONFIG.supreme_threshold, TRADING_CONFIG.noise_threshold)
          assert TRADING_CONFIG.diamond_threshold == 75.0
          assert TRADING_CONFIG.supreme_threshold == 88.0
          PYCONFIG
      - name: Verify unified V16 checkout and canonical report entrypoint
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA:-}"
          test -f scripts/generate_scan_report.py
          test -f core/score_mode_comparison.py
          test "$(grep -RIl --include='*.py' 'Path(\"reports/latest_scan.json\")\.write_text' scripts | wc -l)" -eq 1
          sha256sum scripts/generate_scan_report.py core/score_mode_comparison.py
          echo "unified_checkout_sha=$GITHUB_SHA"
          echo "unified_report_entrypoint=scripts/generate_scan_report.py"

      - name: Generate unified read-only report
        run: |
          report_started=$(date +%s.%N)
          set +e
          python scripts/generate_scan_report.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "report_generator_failed=$rc; publishing blocked fallback"
            python - <<'PYFALLBACK'
          import json, os
          from pathlib import Path
          from config.settings import TRADING_CONFIG
          market = json.loads(Path('reports/market_data.json').read_text()) if Path('reports/market_data.json').exists() else {}
          symbols = os.getenv('SYMBOLS', '').replace(',', ' ').split()
          def blocked(m, s):
            return {'market': m, 'symbol': s, 'status': 'blocked', 'reason': 'REPORT_GENERATOR_FAILED',
                    'components': {x: {'status': 'blocked', 'reason': 'REPORT_GENERATOR_FAILED'} for x in ('darts','timesfm','finbert','news_api','xgboost','smc','vsa','m5')},
                    'vetoes': ['REPORT_GENERATOR_FAILED'], 'approved': False, 'signal_actionable': False, 'actionability_reasons': ['REPORT_GENERATOR_FAILED'], 'direction_calculated': 'NEUTRAL',
                    'm5_confirmation': {'timeframe': 'M5', 'status': 'blocked', 'confirmed': False, 'reason': 'REPORT_GENERATOR_FAILED', 'execution_allowed': False},
                    'candle_timing': {'candle_count': 0, 'last_candle_timestamp_utc': None},
                    'expiration': {'hypothetical_result': None}, 'read_only': True, 'execution_allowed': False, 'executor_enabled': False}
          otc_only = os.getenv('OTC_ONLY', 'false').lower() == 'true'
          market_name = os.getenv('MARKET', 'binary').lower()
          include_otc = os.getenv('INCLUDE_OTC', 'false').lower() == 'true'
          real_symbols = list(dict.fromkeys(s for s in symbols if not s.upper().endswith('-OTC')))
          requested_otc = list(dict.fromkeys(
              s if s.upper().endswith('-OTC') else s + '-OTC' for s in symbols
          ))
          if otc_only or market_name == 'otc':
              binary = [blocked('otc', s) for s in requested_otc]
          else:
              binary = [blocked('binary', s) for s in real_symbols]
              if include_otc and market_name in ('binary', 'unified'):
                  binary.extend(blocked('otc', s) for s in requested_otc)
          forex = [] if otc_only or market_name in ('binary', 'otc') else [blocked('forex', s) for s in real_symbols]
          binary_out = binary if market_name in ('binary', 'unified', 'otc') or otc_only else []
          report = {'schema_version': '2.3', 'mode': 'read_only', 'execution_allowed': False, 'timestamp_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(), 'forex': {'status': 'completed' if market_name in ('forex', 'unified') and not otc_only else 'not_requested', 'analyses': forex}, 'binary': {'status': 'completed' if binary_out or market_name in ('binary', 'unified', 'otc') or otc_only else 'not_requested', 'analyses': binary_out}, 'market_data': market, 'macro_data': {}, 'inputs': {'symbols': symbols, 'include_otc': not otc_only and include_otc, 'otc_only': otc_only}, 'read_only': True, 'executor_enabled': False, 'filters': {'score_minimum': TRADING_CONFIG.diamond_threshold, 'diamond_threshold': TRADING_CONFIG.diamond_threshold, 'supreme_threshold': TRADING_CONFIG.supreme_threshold, 'noise_threshold': TRADING_CONFIG.noise_threshold, 'zero_gale': True, 'payout_minimum': TRADING_CONFIG.payout_minimum}, 'gates': {'score_mode': {'score_gate': 'enforced', 'threshold': TRADING_CONFIG.diamond_threshold, 'other_gates': 'enforced'}, 'no_score_mode': {'score_gate': 'bypassed_only', 'threshold': TRADING_CONFIG.diamond_threshold, 'other_gates': 'enforced', 'ignored_vetoes': ['SCORE_BELOW_MINIMUM']}}, 'error': 'REPORT_GENERATOR_FAILED'}
          Path('reports/latest_scan.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PYFALLBACK
          fi
          python scripts/record_sniper_timing.py report_generation "$report_started"
          exit 0
      - name: Preserve early sniper signals even if later steps fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-sniper-signals-${{ github.run_id }}
          path: |
            reports/live_signals.jsonl
            reports/latest_signal.json
            reports/sniper_timing.json
            reports/sniper_step_timings.jsonl
            reports/sniper_layer_b.json
          if-no-files-found: ignore
      - name: Run isolated sniper Layer B advisory enrichment
        if: github.event.inputs.sniper_mode == 'true'
        run: |
          layer_b_started=$(date +%s.%N)
          python scripts/run_sniper_layer_b.py
          python scripts/record_sniper_timing.py layer_b_advisory "$layer_b_started"
      - name: Verify fast-mode pair coverage and timing provenance
        if: github.event.inputs.fast_mode == 'true'
        run: |
          python - <<'PYFAST'
          import json, os
          from pathlib import Path
          canonical = ['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURGBP','EURJPY','GBPJPY']
          requested = os.environ.get('SYMBOLS','').replace(',',' ').split()
          expected = canonical if any(s.upper() in {'ALL','ALL_AVAILABLE','*'} for s in requested) else [s.upper() for s in requested]
          market = json.loads(Path('reports/market_data.json').read_text())
          timing = json.loads(Path('reports/final_timing.json').read_text())
          report = json.loads(Path('reports/latest_scan.json').read_text())
          analyses = report.get('binary',{}).get('analyses',[])
          missing_market = sorted(set(expected) - set(market.get('symbols',{})))
          missing_timing = sorted(set(expected) - set(timing.get('symbols',{})))
          analyzed = {a.get('symbol') for a in analyses}
          missing_report = sorted(set(expected) - analyzed)
          assert market.get('fetch_mode') == 'fast_direct_m1_m5_uncached', market.get('fetch_mode')
          assert not missing_market, f'missing_market_pairs={missing_market}'
          assert not missing_timing, f'missing_final_timing={missing_timing}'
          assert not missing_report, f'missing_report_pairs={missing_report}'
          assert report.get('read_only') is True and report.get('execution_allowed') is False
          print(f'fast_coverage requested={len(expected)} market={len(market.get("symbols",{}))} timing={len(timing.get("symbols",{}))} analyses={len(analyses)} fresh={len(market.get("fresh_symbols",[]))} blocked={len(expected)-len(set(market.get("fresh_symbols",[])))}')
          PYFAST
      - name: Run TradingAgents shadow committee
        run: python scripts/run_tradingagents_shadow.py
      - name: Evaluate hypothetical result after expiration
        env:
          # Do not spend the workflow timeout waiting for a future candle;
          # the evaluator remains read-only and records pending_expiration when
          # no post-decision candle exists yet.
          PAPER_EXPIRATION_WAIT_SECONDS: 0
        run: python scripts/evaluate_hypothetical_expiration.py
      - name: Validate separated read-only report
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          errors=[]
          r=json.loads(Path('reports/latest_scan.json').read_text())
          market=os.environ.get('MARKET','binary').lower()
          if r.get('mode') != 'read_only': errors.append('mode_not_read_only')
          if r.get('execution_allowed') is not False: errors.append('execution_not_blocked')
          if 'binary' not in r or 'forex' not in r: errors.append('missing_market_books')
          expected_otc_only = bool(r.get('inputs',{}).get('otc_only'))
          expected_binary = market in ('binary','unified','otc') or expected_otc_only
          expected_forex = market in ('forex','unified') and not expected_otc_only
          if (r.get('binary',{}).get('status') == 'completed') != expected_binary: errors.append('binary_status_mismatch')
          if (r.get('forex',{}).get('status') == 'completed') != expected_forex: errors.append('forex_status_mismatch')
          if market == 'binary' and r.get('forex',{}).get('analyses'): errors.append('forex_contaminated_binary')
          if market == 'forex' and r.get('binary',{}).get('analyses'): errors.append('binary_contaminated_forex')
          allowed={'inference_ok','executed','completed','blocked','error','insufficient-data','unavailable'}
          for book_name in ('forex','binary'):
            for item in r.get(book_name,{}).get('analyses',[]):
              if item.get('execution_allowed') is not False: errors.append(f'{book_name}:execution')
              if not isinstance(item.get('components'),dict): errors.append(f'{book_name}:components')
              for name, comp in (item.get('components') or {}).items():
                if not isinstance(comp,dict) or comp.get('status') not in allowed: errors.append(f'{book_name}:{item.get("symbol")}:component:{name}')
                elif comp.get('status') in {'blocked','error','insufficient-data','unavailable'} and not comp.get('reason'): errors.append(f'{book_name}:{item.get("symbol")}:reason:{name}')
              if item.get('market') in {'binary','otc'}:
                m5=item.get('m5_confirmation')
                if not isinstance(m5,dict): errors.append(f'{book_name}:{item.get("symbol")}:m5_missing')
                elif m5.get('execution_allowed') is not False: errors.append(f'{book_name}:{item.get("symbol")}:m5_execution_guard')
                if item.get('approved') is True:
                  direction=item.get('direction_confirmed')
                  direction_ok=isinstance(direction,str) and direction in {'CALL','PUT'}
                  vote_info=item.get('direction_aggregation') or {}
                  counts=vote_info.get('vote_counts') if isinstance(vote_info,dict) else None
                  valid_votes=item.get('direction_valid_votes')
                  required_votes=item.get('direction_required_votes')
                  aggregate_valid=vote_info.get('valid_votes') if isinstance(vote_info,dict) else None
                  aggregate_required=vote_info.get('required_votes') if isinstance(vote_info,dict) else None
                  safe_int=lambda value: isinstance(value,int) and not isinstance(value,bool)
                  votes=item.get('direction_votes')
                  directional_votes=(list(votes.values()) if isinstance(votes,dict) else [])
                  committee=item.get('specialist_committee') or {}
                  if not isinstance(committee,dict): committee={}
                  opposing='PUT' if direction == 'CALL' else 'CALL'
                  direction_count=(counts.get(direction) if isinstance(counts,dict) and direction_ok else None)
                  opposing_count=(counts.get(opposing) if isinstance(counts,dict) and direction_ok else None)
                  m5_data_exception=(item.get('m5_data_unavailable_exception') is True
                    and isinstance(m5,dict) and m5.get('status') == 'blocked'
                    and m5.get('reason') in {'M5_INVALID_CANDLES','M5_INSUFFICIENT_COMPLETED_CANDLES','M5_CLOSED_CANDLES_STALE','M5_CANDLE_GAP'}
                    and committee.get('missing_required') == ['m5']
                    and not committee.get('snapshot_mismatch')
                    and direction_ok
                    and safe_int(valid_votes) and valid_votes >= 2
                    and safe_int(required_votes) and required_votes == 2
                    and safe_int(aggregate_valid) and aggregate_valid == valid_votes
                    and safe_int(aggregate_required) and aggregate_required == 2
                    and safe_int(direction_count) and direction_count >= 2
                    and safe_int(opposing_count) and opposing_count == 0
                    and direction_count + opposing_count == valid_votes
                    and directional_votes.count(direction) == direction_count
                    and directional_votes.count(opposing) == 0
                    and vote_info.get('direction_confirmed') == direction
                    and not str(vote_info.get('direction_reason','')).startswith('DIRECTIONAL_CONFLICT'))
                  if (not isinstance(m5,dict) or m5.get('confirmed') is not True) and not m5_data_exception: errors.append(f'{book_name}:{item.get("symbol")}:approved_without_m5')
                  m5_only_committee_exception=(m5_data_exception
                    and committee.get('missing_required') == ['m5']
                    and not committee.get('snapshot_mismatch'))
                  if committee.get('consensus') != 'ready_for_fusion' and not m5_only_committee_exception: errors.append(f'{book_name}:{item.get("symbol")}:approved_without_agent_consensus')
              if item.get('signal_actionable') is True:
                  timing=item.get('entry_timing') or {}
                  if item.get('approved') is not True: errors.append(f'{book_name}:{item.get("symbol")}:actionable_without_approval')
                  if timing.get('valid') is not True or timing.get('execution_allowed') is not False: errors.append(f'{book_name}:{item.get("symbol")}:actionable_without_valid_timing')
                  if not timing.get('entry_timestamp') or not timing.get('exact_second') == 0: errors.append(f'{book_name}:{item.get("symbol")}:actionable_without_exact_entry')
                  if item.get('actionability_reasons'): errors.append(f'{book_name}:{item.get("symbol")}:actionable_with_vetoes')
          finbert_path=Path('reports/finbert_inference.json')
          if finbert_path.exists():
            f=json.loads(finbert_path.read_text())
            if f.get('read_only') is not True or f.get('execution_allowed') is not False: errors.append('finbert_execution_guard')
          if errors:
            print('read_only_validation=BLOCKED', json.dumps(errors, ensure_ascii=False))
            # A blocked report is a valid outcome; only safety/separation errors fail.
            hard=[e for e in errors if 'execution' in e or 'contaminated' in e or 'mode_' in e or 'status_mismatch' in e or 'm5_missing' in e or 'approved_without_m5' in e or 'approved_without_agent_consensus' in e]
            if hard: sys.exit(1)
          print('read_only_validation=OK; separated; execution=BLOCKED')
          PY
      - name: Publish scan summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.signal_reporting import format_signal_summary
          report=json.load(open('reports/latest_scan.json'))
          signal_lines=format_signal_summary(report.get('binary',{}).get('analyses',[]))
          print('\n'.join(signal_lines))
          rows=[]
          for item in report.get('binary',{}).get('analyses',[]):
              confirmed = item.get('direction_confirmed')
              m5_bias = (item.get('m5_confirmation') or {}).get('m5_bias')
              observed = item.get('direction_observed')
              direction = confirmed or m5_bias or observed or 'NEUTRAL'
              direction_state = 'confirmed' if confirmed else 'bias/observed'
              entry = (item.get('entry_timing') or {}).get('execution_sniper_at') or '—'
              rows.append({
                  'symbol': item.get('symbol'),
                  'score': item.get('score'),
                  'approved': item.get('approved'),
                  'actionable': item.get('signal_actionable'),
                  'direction': direction,
                  'direction_state': direction_state,
                  'entry': entry,
                  'vetoes': item.get('vetoes',[]),
                  'actionability_reasons': item.get('actionability_reasons',[]),
                  'fusion': item.get('score_fusion',{}),
              })
          out=signal_lines + ['', '## Binary Quant X — scan read-only', '', f"Schema: {report.get('schema_version')}", f"Execution allowed: {report.get('execution_allowed')}", '', '| Par | Score | Aprovado | Acionável agora | Direção | Entrada | Vetos |', '|---|---:|:---:|:---:|---|---|---|']
          for row in rows:
              veto='; '.join(map(str,row['vetoes'] + row['actionability_reasons'])) or '—'
              out.append(f"| {row['symbol']} | {row['score']} | {row['approved']} | {row['actionable']} | {row['direction']} ({row['direction_state']}) | {row['entry']} | {veto} |")
          Path('scan_summary.md').write_text('\n'.join(out)+'\n')
          Path('reports/scan_summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          with open('${GITHUB_STEP_SUMMARY}','a') as f: f.write('\n'.join(out)+'\n')
          print('scan_summary=published',len(rows))
          PY
      - name: Upload latest scan
        uses: actions/upload-artifact@v4
        with:
          name: latest-scan-${{ github.run_id }}
          path: |
            reports/latest_scan.json
            reports/tradingagents_shadow.json
            reports/darts_inference.json
            reports/finbert_inference.json
            reports/m5_shadow_inference.json
            reports/module-logs/m5_shadow.log
            reports/live_signals.jsonl
            reports/latest_signal.json
            reports/sniper_timing.json
            reports/sniper_step_timings.jsonl
            reports/sniper_layer_b.json

