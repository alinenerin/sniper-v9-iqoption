name: Unified V16 Scan - Read Only

on:
  workflow_dispatch:
    inputs:
      include_otc:
        description: 'Incluir pares OTC'
        required: true
        default: false
        type: boolean
      symbols:
        description: 'Pares separados por espaço'
        required: true
        default: 'EURUSD GBPUSD USDJPY AUDUSD'
        type: string

jobs:
  unified-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANALYSIS_ONLY: '1'
      EXECUTION_ALLOWED: 'false'
      EXECUTOR_ENABLED: 'false'
      INCLUDE_OTC: ${{ inputs.include_otc }}
      SYMBOLS: ${{ inputs.symbols }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install light analysis stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Architecture guard
        run: |
          python audit_architecture.py
          python audit_readonly_validation.py
      - name: Fetch live market data from Railway
        env:
          RAILWAY_GATEWAY_URL: https://trader-analysis-api-production-82ba.up.railway.app
        run: python scripts/fetch_railway_market.py
      - name: Install Darts runtime
        run: pip install 'Darts>=0.30,<1.0'
      - name: Run Darts anomaly inference
        run: python scripts/run_darts_inference.py
      - name: Compile read-only analysis modules
        run: python -m py_compile shared_ai/consultation.py scripts/generate_scan_report.py scripts/run_darts_inference.py
      - name: Generate unified report from Railway candles
        run: python scripts/generate_scan_report.py
      - name: Validate report contract and component evidence
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/latest_scan.json'))
          assert r['execution_allowed'] is False
          assert r['mode'] == 'read_only'
          assert 'binary' in r and 'forex' in r
          assert r['forex']['status'] == 'completed'
          assert r['binary']['status'] == 'completed'
          for book in (r['forex'], r['binary']):
              for item in book['analyses']:
                  assert item['execution_allowed'] is False
                  assert item.get('components')
                  for component in item['components'].values():
                      assert component['status'] in ('inference_ok', 'blocked')
                      if component['status'] == 'blocked': assert component.get('reason')
          print('unified_report=OK; component_statuses=OK; execution=BLOCKED')
          PY
      - name: Upload latest scan
        uses: actions/upload-artifact@v4
        with:
          name: latest-scan-${{ github.run_id }}
          path: reports/latest_scan.json
