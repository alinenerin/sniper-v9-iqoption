name: Unified V16 Scan - Read Only

on:
  workflow_dispatch:
    inputs:
      include_otc:
        description: 'Incluir pares OTC'
        required: true
        default: false
        type: boolean
      symbols:
        description: 'Pares separados por espaço'
        required: true
        default: 'EURUSD GBPUSD USDJPY AUDUSD'
        type: string

jobs:
  unified-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANALYSIS_ONLY: '1'
      EXECUTION_ALLOWED: 'false'
      EXECUTOR_ENABLED: 'false'
      INCLUDE_OTC: ${{ inputs.include_otc }}
      SYMBOLS: ${{ inputs.symbols }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install light analysis stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Architecture guard
        run: |
          python audit_architecture.py
          python audit_readonly_validation.py
      - name: Fetch live market data from Railway
        env:
          RAILWAY_GATEWAY_URL: https://trader-analysis-api-production-82ba.up.railway.app
        run: python scripts/fetch_railway_market.py
      - name: Install Darts runtime
        run: pip install 'Darts>=0.30,<1.0'
      - name: Run Darts anomaly inference
        run: python scripts/run_darts_inference.py
      - name: Install TimesFM runtime
        run: pip install 'timesfm>=1.3.0'
      - name: Run real TimesFM inference
        run: python scripts/run_timesfm_inference.py
      - name: Install FinBERT runtime
        run: pip install 'torch>=2.2' 'transformers>=4.40' sentencepiece requests
      - name: Run real FinBERT inference
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: python scripts/run_finbert_inference.py
      - name: Install XGBoost runtime
        run: pip install 'xgboost>=2.0' scikit-learn
      - name: Train and run XGBoost inference
        run: python scripts/train_xgboost_inference.py
      - name: Compile read-only analysis modules
        run: python -m py_compile shared_ai/consultation.py scripts/generate_scan_report.py scripts/run_darts_inference.py scripts/run_timesfm_inference.py scripts/run_finbert_inference.py scripts/train_xgboost_inference.py
      - name: Generate unified report from Railway candles
        run: python scripts/generate_scan_report.py
      - name: Validate report contract and component evidence
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/latest_scan.json'))
          assert r['execution_allowed'] is False
          assert r['mode'] == 'read_only'
          assert 'binary' in r and 'forex' in r
          assert r['forex']['status'] == 'completed'
          assert r['binary']['status'] == 'completed'
          for book_name, book in (('forex', r['forex']), ('binary', r['binary'])):
              for item in book.get('analyses', []):
                  assert item.get('execution_allowed') is False, (book_name, item.get('symbol'))
                  components=item.get('components') or {}
                  assert isinstance(components, dict), (book_name, item.get('symbol'))
                  for name, component in components.items():
                      assert isinstance(component, dict), (name, component)
                      status=component.get('status')
                      assert status in ('inference_ok', 'blocked'), (name, status)
                      if status == 'blocked': assert component.get('reason'), (name, component)
          print('unified_report=OK; component_statuses=OK; execution=BLOCKED')
          PY
      - name: Upload latest scan
        uses: actions/upload-artifact@v4
        with:
          name: latest-scan-${{ github.run_id }}
          path: reports/latest_scan.json
