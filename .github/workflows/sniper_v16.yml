name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xgboost iqoptionapi pandas requests talib-binary

      - name: Create Executor Script
        run: |
          echo "import os; print('🏛️ V16 SUPREME ONLINE'); os.system('python sniper_loop.py')" > executor_v16_supreme.py

      - name: Run Sniper V16 Executor
        run: |
          timeout 350m python executor_v16_supreme.py || echo 'Sessão finalizada.'

