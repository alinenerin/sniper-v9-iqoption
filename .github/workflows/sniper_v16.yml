name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Core AI (XGBoost)
        run: |
          pip install --no-cache-dir xgboost pandas requests

      - name: Install Broker API
        run: |
          pip install --no-cache-dir iqoptionapi || pip install git+https://github.com/Lu-Yi-Hsun/iqoptionapi.git

      - name: Install Technical Analysis (TA-Lib)
        run: |
          pip install talib-binary || echo 'TA-Lib installation failed, skipping...'

      - name: Create Executor Script
        run: |
          echo "import os; print('🏛️ V16 SUPREME ONLINE'); os.system('python sniper_loop.py')" > executor_v16_supreme.py

      - name: Run Sniper V16 Executor
        run: |
          timeout 350m python executor_v16_supreme.py || echo 'Sessão finalizada.'

