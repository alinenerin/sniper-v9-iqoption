name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  schedule:
    - cron: '0 */6 * * *' # Reinicia a cada 6 horas automaticamente
  workflow_dispatch:      # Permite rodar manualmente

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Correção XGBoost)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xgboost iqoptionapi pandas talib-binary

      - name: Run Sniper V16 Executor
        env:
          IQ_USER: laiane.aline@gmail.com
          IQ_PASS: alineegui95
        run: |
          # Aqui ele executa o seu script principal
          # Usamos timeout para não exceder o limite do GitHub e permitir o reinício
          timeout 350m python executor_v16_supreme.py || echo "Sessão finalizada ou timeout atingido."
