name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  workflow_dispatch:

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Libs
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          pip install xgboost pandas requests iqoptionapi talib-binary
      - name: Exec
        run: |
          echo "import os; print('🏛️ V16 SUPREME ONLINE'); os.system('python sniper_loop.py')" > run.py
          python run.py
