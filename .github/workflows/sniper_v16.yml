name: Sniper V16 Supreme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sniper_v16.yml'
      - 'sniper_loop.py'
      - 'core/forecasting/google_timesfm_bridge.py'

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: System Deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install Libs
        run: |
          pip install --no-cache-dir xgboost pandas numpy scipy requests websocket-client==0.56.0
          pip install git+https://github.com/Lu-Yi-Hsun/iqoptionapi.git
      - name: Install TimesFM 2.5 (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/google-research/timesfm.git
      - name: Start Sniper V16 Supreme
        env:
          IQ_USER: laiane.aline@gmail.com
          IQ_PASS: alineEgui95@
        run: python sniper_loop.py --scan-only
