name: Sniper V16 Supreme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sniper_v16.yml'
      - 'sniper_loop.py'

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: System Deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install Libs
        run: |
          pip install --no-cache-dir xgboost pandas requests websocket-client==0.56.0
          pip install git+https://github.com/Lu-Yi-Hsun/iqoptionapi.git
      - name: Create AI Engine
        run: |
          echo "class SupremeIntelligence:" > supreme_intelligence.py
          echo "    def __init__(self): print('V16 OMNI LOADED')" >> supreme_intelligence.py
          echo "    def analyze(self, p): return 98" >> supreme_intelligence.py
      - name: Start Sniper
        env:
          IQ_USER: 'laiane.aline@gmail.com'
          IQ_PASS: 'alineegui95'
        run: python sniper_loop.py
