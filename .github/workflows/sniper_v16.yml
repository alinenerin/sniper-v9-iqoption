name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: ⚙️ Dependências do Sistema
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      
      - name: 📦 Instalando Core (XGBoost & Pandas)
        run: pip install --no-cache-dir xgboost pandas requests iqoptionapi
      
      - name: 🚀 Execução Sniper
        run: |
          echo "import os; print('🏛️ V16 SUPREME ONLINE'); os.system('python sniper_loop.py')" > start.py
          python start.py
