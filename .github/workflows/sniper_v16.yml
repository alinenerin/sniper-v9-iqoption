name: Sniper V16 Supreme - Operacional Grátis 24/7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trading:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: ⚙️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          pip install --no-cache-dir xgboost pandas requests iqoptionapi talib-binary
      
      - name: 🚀 Run V16 Supreme
        run: |
          echo "import os; print('🏛️ V16 SUPREME ONLINE - MOTOR INICIADO'); os.system('python sniper_loop.py')" > start.py
          python start.py
