name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  titan-deployment:
    runs-on: ubuntu-latest
    container:
      # Imagem de elite para Trading Quantitativo - Já contém TA-Lib e Python otimizados.
      image: quantlib/python:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install System Engine
        run: |
          apt-get update && apt-get install -y libta-lib0-dev build-essential

      - name: Activate AI Stack
        run: |
          pip install --no-cache-dir xgboost==1.7.5 TA-Lib iqoptionapi marketaux polygon-api-client pytz joblib pandas numpy==1.23.5

      - name: Final Verification
        run: |
          python -c "import talib; import xgboost; print('TA-Lib: OK ✅'); print('XGBoost: OK ✅')"
