name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  definitive-build-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install AI Stack (TA-Lib Binary Method)
        run: |
          python -m pip install --upgrade pip
          # TA-Lib-Binary é a solução para ambientes de nuvem restritos
          pip install ta-lib-binary
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib numpy pandas

      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
