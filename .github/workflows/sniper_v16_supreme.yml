name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  titan-deployment:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim-bullseye
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          make install
          cd ..
          ldconfig

      - name: Install AI Stack
        run: |
          pip install --upgrade pip
          pip install numpy==1.23.5 pandas==1.5.3
          TA_INCLUDE_PATH=/usr/include TA_LIBRARY_PATH=/usr/lib pip install TA-Lib
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib

      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
