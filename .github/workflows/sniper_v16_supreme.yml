name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  check-critical-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Primary Stack
        run: |
          pip install xgboost==1.7.5 iqoptionapi
      - name: Double Check Verification
        run: |
          python -c "import xgboost; print('XGBoost: OK ✅')"
          python -c "import iqoptionapi; print('IQOptionAPI: OK ✅')"
