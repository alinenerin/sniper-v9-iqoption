name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  trading-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install AI Stack
        run: |
          python -m pip install --upgrade pip
          pip install xgboost==1.7.5 numpy==1.23.5 pandas==1.5.3 iqoptionapi
      - name: Verify XGBoost
        run: |
          python -c "import xgboost; print('XGBoost Operacional:', xgboost.__version__)"
