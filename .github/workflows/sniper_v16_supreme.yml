name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  definitive-v16-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Definitive TA-Lib & AI Stack Installation
        run: |
          python -m pip install --upgrade pip
          # A solução definitiva para containers/nuvem: talib-binary (inclui o binário C estático)
          pip install talib-binary
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib numpy pandas

      - name: Technical Validation (The Final Word)
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
