name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  trading-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install AI Stack
        run: |
          pip install numpy==1.23.5 pandas==1.5.3 xgboost==1.7.5 scikit-learn==1.2.2 iqoptionapi marketaux polygon-api-client pytz joblib
      - name: Run Engines
        env:
          IQ_USER: ${{ secrets.IQ_USER }}
          IQ_PASSWORD: ${{ secrets.IQ_PASS }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python executor_v16_supreme.py --max-runtime 21000 &
          python FOREX_SUPREME_FINAL_V16.py --max-runtime 21000 &
          wait
