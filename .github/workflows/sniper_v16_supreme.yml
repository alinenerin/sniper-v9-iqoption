name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  ultimate-build-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Conda & TA-Lib
        uses: s-weigand/setup-conda@v1
        with:
          update-conda: true
      
      - name: Install TA-Lib and AI Stack
        run: |
          # O Conda instala a TA-Lib e já faz o link com o Python de forma nativa
          conda install -c conda-forge ta-lib -y
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib numpy pandas

      - name: Final Verification (The Veredict)
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
