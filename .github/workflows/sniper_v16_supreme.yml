name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  build-crew-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install AI Stack with Pre-compiled TA-Lib
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 pandas==1.5.3 xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib
          # Usar a versão binária que não precisa de compilação C
          pip install TA-Lib
      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK'); print('TA-Lib: OK')"
