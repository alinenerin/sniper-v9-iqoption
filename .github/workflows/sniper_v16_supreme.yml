name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  build-crew-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install System TA-Lib
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/ && ./configure --prefix=/usr && make && sudo make install && cd ..
      - name: Install Python AI Stack (Crew V16)
        run: |
          pip install numpy==1.23.5 pandas==1.5.3 xgboost==1.7.5 iqoptionapi TA-Lib marketaux polygon-api-client pytz joblib
      - name: Final Verification
        run: |
          python -c "import xgboost; import TA_Lib; import iqoptionapi; print('Crew V16: Motores prontos! ✅')"
