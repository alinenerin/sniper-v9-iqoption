name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  ultra-deployment:
    runs-on: ubuntu-latest
    container:
      # Imagem de Elite (Kaggle/Python) - Contém TA-Lib, XGBoost, Pandas e Numpy pré-instalados.
      image: gcr.io/kaggle-images/python:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Supreme Verification (No Installation Needed)
        run: |
          # Aqui não instalamos nada, apenas testamos o que já vem "de fábrica" na imagem de elite.
          python3 -c "import talib; import xgboost; print('TA-Lib: OK ✅'); print('XGBoost: OK ✅')"

      - name: Final Connectivity (IQ Option & Tools)
        run: |
          # Apenas instalar conectores leves
          pip install iqoptionapi marketaux polygon-api-client pytz joblib

      - name: Execution Test (Cérebro V16)
        run: |
          # Testar se o coração do sistema pulsa
          python3 cérebro_v16.py --check-only
