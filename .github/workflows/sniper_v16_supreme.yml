name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  build-crew-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install TA-Lib (Pre-compiled Binary)
        run: |
          wget https://github.com/the-maldridge/ta-lib-debian/releases/download/v0.4.0-one/ta-lib_0.4.0_amd64.deb
          sudo dpkg -i ta-lib_0.4.0_amd64.deb
      - name: Install Python AI Stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 pandas==1.5.3 xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib
          pip install TA-Lib
      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK'); print('TA-Lib: OK')"
