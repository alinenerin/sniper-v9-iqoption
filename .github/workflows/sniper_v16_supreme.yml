name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  smc-build-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install System TA-Lib (The Program - Native)
        run: |
          # Adicionando o repositório que contém o binário já compilado para o Ubuntu do GitHub
          sudo add-apt-repository ppa:optics/ppa -y
          sudo apt-get update
          sudo apt-get install libta-lib0-dev -y

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Connect Python to TA-Lib
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 pandas==1.5.3 
          # Agora o sistema já tem a lib no path padrão (/usr/include e /usr/lib)
          pip install TA-Lib
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib

      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
