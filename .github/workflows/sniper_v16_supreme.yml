name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  build-crew-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (The Hard Way)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libtool autoconf automake
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib/
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          # Atualizar o cache de bibliotecas do sistema para o Linux "enxergar" a TA-Lib
          sudo ldconfig

      - name: Install Python Stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.23.5 pandas==1.5.3 
          # Instalar o wrapper python especificando onde está a lib do sistema
          pip install TA-Lib
          pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib

      - name: Final Verification
        run: |
          python -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
