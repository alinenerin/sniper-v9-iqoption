name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  victory-deployment:
    runs-on: ubuntu-latest
    container:
      image: cloudsuite/data-analytics
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install AI Stack (The Right Way)
        run: |
          # Usar o python3 e pip3 do container que já tem a TA-Lib
          python3 -m pip install --upgrade pip
          python3 -m pip install xgboost==1.7.5 iqoptionapi marketaux polygon-api-client pytz joblib pandas numpy==1.23.5

      - name: Final Verification
        run: |
          python3 -c "import xgboost; import talib; print('XGBoost: OK ✅'); print('TA-Lib: OK ✅')"
