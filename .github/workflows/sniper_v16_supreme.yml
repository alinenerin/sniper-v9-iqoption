name: Sniper V16 Supreme - Dual Engine (Binary & Forex)
on:
  workflow_dispatch:
jobs:
  check-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Install Critical Libs
        run: |
          python -m pip install --upgrade pip
          pip install xgboost==1.7.5 iqoptionapi
      - name: Verify Installation
        run: |
          python -c "import xgboost; import iqoptionapi; print('XGBoost e IQOptionAPI instalados com sucesso!')"
