name: Architecture Checks - Separate Engines

on:
  push:
    paths:
      - 'executor_v16_supreme.py'
      - 'FOREX_SUPREME_FINAL_V16.py'
      - 'shared_ai/**'
      - 'engines/**'
      - 'config/markets/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pandas numpy 'pytz>=2023.3' 'requests>=2.31'
      - name: Compile and boundary tests
        run: |
          python -m py_compile executor_v16_supreme.py FOREX_SUPREME_FINAL_V16.py shared_ai/consultation.py engines/binary/operational.py config/markets/contracts.py
          python - <<'PY'
          from pathlib import Path
          b = Path('executor_v16_supreme.py').read_text()
          f = Path('FOREX_SUPREME_FINAL_V16.py').read_text()
          assert 'FOREX_SUPREME_FINAL_V16' not in b
          assert 'executor_v16_supreme' not in f
          assert 'from shared_ai.consultation import SharedAI' in b
          assert 'from shared_ai.consultation import SharedAI' in f
          assert 'buy(' not in b
          assert 'buy(' not in Path('engines/binary/operational.py').read_text()
          print('engine boundaries: OK')
          PY
      - name: Test directional score and evidence fusion regressions
        run: python -m unittest -v tests.test_directional_score_symmetry
      - name: Test market-data contract regression cases
        run: |
          python -m unittest -v test_market_data_contract.py
          python -m unittest -v tests.test_market_data_contract
      - name: Test direction aggregation, stream cache, warm readiness, and SMC fallback
        run: |
          python -m unittest -v tests.test_direction_aggregator
          python -m unittest -v tests.test_live_stream_cache
          python -m unittest -v tests.test_warm_readiness
          python -m unittest -v tests.test_smc_structure_fallback
      - name: Test signal actionability, M5 confirmation, and market-lane routing
        run: |
          python -m unittest -v tests.test_signal_actionability
          python -m unittest -v tests.test_m5_signal_gate
          python -m unittest -v tests.test_market_lane_routing
          python -m unittest -v tests.test_fast_market_lane

      - name: Test isolated sniper timing and temporal observation telemetry
        run: python -m unittest -v tests.test_sniper_mode
