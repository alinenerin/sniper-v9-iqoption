name: Forex V16 Supreme - Read Only

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7-20 * * 1-5'
    - cron: '0 0-5 * * 2-6'

env:
  PYTHON_VERSION: '3.11'

jobs:
  forex-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests pytz websocket-client scikit-learn xgboost
      - name: Architecture and read-only checks
        run: |
          python -m py_compile FOREX_SUPREME_FINAL_V16.py shared_ai/consultation.py config/markets/contracts.py
          python - <<'PY'
          from pathlib import Path
          forex = Path('FOREX_SUPREME_FINAL_V16.py').read_text()
          assert 'executor_v16_supreme' not in forex
          assert 'from shared_ai.consultation import SharedAI' in forex
          print('forex boundary: OK')
          PY
      - name: Forex analysis (read-only)
        env:
          IQ_USER: ${{ secrets.IQ_USER }}
          IQ_PASS: ${{ secrets.IQ_PASS }}
          BALANCE_MODE: PRACTICE
        run: timeout 340m python3 FOREX_SUPREME_FINAL_V16.py --scan-only
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-v16-readonly-logs
          path: |
            *.log
            forex_performance.db
            logs/
          retention-days: 7
