[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
    "python -m venv /app/.venv",
    "source /app/.venv/bin/activate",
    "pip install --upgrade pip",
    "pip install --no-cache-dir -r requirements.txt",
    "rm -rf /root/.cache/pip"
]

[start]
cmd = "python sentinela_v16_background.py"
